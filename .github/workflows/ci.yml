name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests eval/run_eval.py
          ruff format --check src tests eval/run_eval.py
      - name: Unit tests
        run: pytest -q
      - name: Eval smoke test (ruff only, no LLM)
        run: python eval/run_eval.py --provider lint-only > /dev/null

  llm-eval:
    # Gate prompt/model changes on the seeded-bug eval set. Skipped when no API key is set.
    needs: test
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Agent eval gate
        if: env.GOOGLE_API_KEY != ''
        run: python eval/run_eval.py --sleep 4 --min-recall 0.6 --min-precision 0.6 > /dev/null

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pr-review-agent:${{ github.sha }} .
      - name: Smoke test container
        run: |
          docker run -d --name svc -p 8080:8080 -e ALLOW_UNSIGNED_WEBHOOKS=1 pr-review-agent:${{ github.sha }}
          for i in $(seq 1 20); do curl -fs localhost:8080/healthz && break; sleep 1; done
          curl -fs localhost:8080/healthz
          docker rm -f svc
