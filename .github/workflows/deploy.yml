name: Deploy to Cloud Run

# Runs after CI passes on main. Skipped until the GCP_PROJECT_ID repository variable is set.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SERVICE: pr-review-agent
  REGION: ${{ vars.GCP_REGION || 'asia-south1' }}

jobs:
  deploy:
    if: >-
      vars.GCP_PROJECT_ID != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "$REGION" \
            --source . \
            --allow-unauthenticated \
            --no-cpu-throttling \
            --min-instances 0 --max-instances 2 \
            --set-env-vars "REVIEW_PROVIDER=gemini,GITHUB_APP_ID=${{ vars.GITHUB_APP_ID }}" \
            --set-secrets "GOOGLE_API_KEY=google-api-key:latest,GITHUB_APP_PRIVATE_KEY=github-app-private-key:latest,GITHUB_WEBHOOK_SECRET=github-webhook-secret:latest"

      - name: Health check
        run: |
          URL=$(gcloud run services describe "$SERVICE" --project "${{ vars.GCP_PROJECT_ID }}" --region "$REGION" --format 'value(status.url)')
          curl -fs "$URL/healthz"
