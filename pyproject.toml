[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-review-agent"
version = "0.1.0"
description = "LangGraph agent that reviews GitHub pull requests and posts inline comments"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-google-genai>=4.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyjwt[crypto]>=2.8",
    "ruff>=0.6",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.0"]
ollama = ["langchain-ollama>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
pr-review = "reviewer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["eval/cases"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
